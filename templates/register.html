{% extends "base.html" %}
{% block title %}Request access · Beta Access{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Request access</h1>
  <p class="muted">Create a tester account in a few seconds.</p>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <div class="pw">
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <button type="button" class="toggle" aria-label="Show password" aria-pressed="false">Show</button>
    </div>
    <button type="submit" class="btn full">Create account</button>
  </form>
  <p class="links">Already a tester? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
