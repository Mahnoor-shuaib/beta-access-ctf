<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Beta Access{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <a class="logo" href="{{ url_for('home') }}">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12"/><path d="M9 14.5l3.2 3.2L19.5 10" stroke="#0b0f1a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>beta<strong>access</strong></span>
    </a>
    <nav>
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('changelog') }}">Changelog</a>
      {% if current_user %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('insider') }}">Insider Tools</a>
        <a class="pill" href="{{ url_for('logout') }}">Log out</a>
      {% else %}
        <a class="pill" href="{{ url_for('login') }}">Log in</a>
      {% endif %}
    </nav>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<p class="flash" role="alert">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="foot">Beta Access &middot; Thanks for testing with us</footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
